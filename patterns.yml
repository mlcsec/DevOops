    # Generic 
    - pattern:
        name: Generic Host Variable
        regex: (\$(?:host|server)|(?:HOST|HOSTNAME|SERVER|connection_host|remote_host))\s*[:=]\s*['"][^'"]*['"]

    - pattern:
        name: Generic Username Variable
        regex: (\$(?:username|user|login)|(?:USERNAME|LOGIN|USER|db_user|auth_user))\s*[:=]\s*['"][^'"]*['"]

    - pattern:
        name: Generic Password Variable
        regex: (\$(?:password|pass|pwd|credential)|(?:PASSWORD|PASS|PWD|db_pass|auth_key))\s*[:=]\s*['"][^'"]{6,}['"]

    - pattern:
        name: Generic DB Variable
        regex: (\$(?:database|db|schema)|(?:DATABASE|SCHEMA|db_name|database_connection))\s*[:=]\s*['"][^'"]*['"]

    - pattern:
        name: Generic Port Variable
        regex: (\$(?:port|db_port)|(?:PORT|SERVER_PORT|connection_port))\s*[:=]\s*\d{2,5}

    - pattern:
        name: Generic API Key Variable
        regex: (\$(?:apiKey|api_key|access_key)|(?:API_?KEY|ACCESS_?KEY|client_key|service_token))\s*[:=]\s*['"][a-zA-Z0-9_\-]{10,}['"]

    - pattern:
        name: Generic API Secret Variable
        regex: (\$(?:apiSecret|api_secret|secret_key)|(?:API_?SECRET|ACCESS_?SECRET|client_secret|service_secret))\s*[:=]\s*['"][a-zA-Z0-9+/]{20,}['"]

    - pattern:
        name: Generic Sensitive Variable
        regex: (\$(?:secret|token|credentials|auth_token)|(?:SECRET|TOKEN|CREDENTIALS|OAUTH_TOKEN|bearer_token))\s*[:=]\s*['"][a-zA-Z0-9+/]{20,}['"]

