    # GitHub
    - pattern:
        name: GitHub
        regex: '[gG][iI][tT][hH][uU][bB].*[''|"][0-9a-zA-Z]{35,40}[''|"]'
        
    - pattern:
        name: Github - 2
        regex: \b((?:ghp|gho|ghu|ghs|ghr)_[a-zA-Z0-9]{36,255}\b)
        
    - pattern:
        name: Github App Token
        regex: (ghu|ghs)_[0-9a-zA-Z]{36}
        
    - pattern:
        name: Github OAuth Access Token
        regex: gho_[0-9a-zA-Z]{36}
        
    - pattern:
        name: Github Personal Access Token
        regex: ghp_[0-9a-zA-Z]{36}
        
    - pattern:
        name: Github Refresh Token
        regex: ghr_[0-9a-zA-Z]{76}
        
    - pattern:
        name: Github_old
        regex: (?:github)[^\.].{0,40}[ =:'"]+([a-f0-9]{40})\b
        
    - pattern:
        name: Githubapp - 1
        regex: (?:github).{0,40}\b([0-9]{6})\b
        
    - pattern:
        name: Githubapp - 2
        regex:
            (?:github).{0,40}(-----BEGIN RSA PRIVATE KEY-----\s[A-Za-z0-9+\/\s]*\s-----END
            RSA PRIVATE KEY-----)
        
    - pattern:
        name: Gitlab
        regex: (?:gitlab).{0,40}\b([a-zA-Z0-9\-=_]{20,22})\b
        
    - pattern:
        name: Gitlabv2
        regex: \b(glpat-[a-zA-Z0-9\-=_]{20,22})\b
        

