    - pattern:
        name: datadog_api_key
        regex: datadog[_-]?api[_-]?key(=| =|:| :)

    - pattern:
        name: datadog_app_key
        regex: datadog[_-]?app[_-]?key(=| =|:| :)

    - pattern:
        name: db_connection
        regex: db[_-]?connection(=| =|:| :)

    - pattern:
        name: db_database
        regex: db[_-]?database(=| =|:| :)

    - pattern:
        name: db_host
        regex: db[_-]?host(=| =|:| :)

    - pattern:
